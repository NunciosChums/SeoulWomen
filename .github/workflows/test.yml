name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SeoulWomen
    steps:
      - uses: actions/checkout@v5
      # gradle/gradle-daemon-jvm.properties의 데몬 JVM과 맞춘다.
      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # app/build.gradle.kts가 local.properties의 API_KEY를 필수로 읽는다. 단위 테스트는 실제 API를 호출하지 않는다.
      - name: Create local.properties
        run: echo 'API_KEY="ci-placeholder"' > local.properties
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
